worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream django {
        server backend:8000;
    }

    # AI upstream resolved at request time (service may be absent)
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8085;
        server_name _;

        # ── UI static files (Vite build output) ──────────────────
        root /usr/share/nginx/html;
        index index.html;

        # ── Django REST API ───────────────────────────────────────
        location /api/ {
            proxy_pass         http://django/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django admin (optional) ──────────────────────────────
        location /admin/ {
            proxy_pass         http://django/admin/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── AI WebSocket (internal use — UI uses polling via /api/ai/) ──
        location /ai/ws {
            set $ai_ws http://ai:8080;
            proxy_pass         $ai_ws/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── AI FastAPI (internal/debug — strip /ai/ prefix) ─────────
        location /ai/ {
            set $ai_http http://ai:8080;
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass         $ai_http;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── SPA fallback (React Router / wouter) ─────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
