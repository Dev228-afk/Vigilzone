# Identity-driven alert policy — severity & suppression rules
# See instrunctions.md §8 for full specification

policy:
  time_rules:
    night_hours: [22, 6]        # UTC hours: 22:00 → 06:00

  intrusion:
    unknown_in_restricted: "HIGH"
    known_family_in_restricted: "LOW"
    suppress_known_roles:
      - OWNER
      - FAMILY

  animals:
    known_pet: "SUPPRESS"
    unknown_animal_night: "MED"
